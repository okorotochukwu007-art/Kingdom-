    <!-- Suppress third-party browser extension errors (MetaMask, Web3 wallets, adblockers) -->
    <script>
      (function() {
        function isExt(e) {
          if (!e) return false;
          var str = (e.message || (e.reason && e.reason.message) || e.filename || '' + e).toLowerCase();
          var stack = ((e.error && e.error.stack) || (e.reason && e.reason.stack) || '').toLowerCase();
          return str.indexOf('metamask') !== -1 ||
                 str.indexOf('ethereum') !== -1 ||
                 str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('moz-extension://') !== -1 ||
                 stack.indexOf('chrome-extension://') !== -1;
        }
        window.addEventListener('error', function(ev) {
          if (isExt(ev.error) || isExt(ev)) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(ev) {
          if (isExt(ev.reason)) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
